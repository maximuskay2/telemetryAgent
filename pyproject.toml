[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-agent"
version = "0.1.0"
description = "Real-time log ingestion and telemetry diagnosis starter"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.6",
  "uvicorn[standard]>=0.29"
]

[project.optional-dependencies]
modal = ["modal>=0.64"]

[tool.setuptools.packages.find]
include = ["apps*", "core*"]
